<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #07090a;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: white;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 80% at 98% 50%, rgba(201,243,29,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 2% 50%, rgba(201,243,29,0.06) 0%, transparent 55%),
      linear-gradient(160deg, #0d1209 0%, #07090a 50%, #040504 100%);
  }

  /* Decorative large logo watermark */
  .logo-watermark {
    position: absolute;
    right: -30px;
    top: 50%;
    transform: translateY(-50%);
    width: 440px;
    height: 440px;
    opacity: 0.07;
    background-image: url('/sander-logo.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  /* Lime glow blob top-right */
  .glow {
    position: absolute;
    right: 80px;
    top: -60px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(201,243,29,0.22) 0%, transparent 70%);
    border-radius: 50%;
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 72px;
    gap: 52px;
  }

  /* Left: logo + name */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    flex-shrink: 0;
  }

  .logo {
    width: 88px;
    height: 88px;
    object-fit: contain;
  }

  .brand-name {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    color: white;
  }

  .accent-dot {
    color: #c9f31d;
  }

  /* Divider */
  .divider {
    width: 2px;
    height: 220px;
    background: linear-gradient(to bottom, transparent, rgba(201,243,29,0.4), transparent);
    flex-shrink: 0;
  }

  /* Right: tagline + pills */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .tagline {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: white;
  }

  .tagline .highlight {
    color: #c9f31d;
  }

  .sub {
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.2px;
  }

  .pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .pill-lime {
    background: rgba(201,243,29,0.15);
    color: #c9f31d;
    border: 1px solid rgba(201,243,29,0.3);
  }

  .pill-white {
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.12);
  }

  .pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.7;
  }

  /* Bottom strip */
  .strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(to right, transparent 0%, #c9f31d 30%, #c9f31d 70%, transparent 100%);
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="logo-watermark"></div>
  <div class="glow"></div>

  <div class="content">
    <!-- Brand -->
    <div class="brand">
      <img class="logo" src="https://www.sanderbv.it/sander-logo.png" alt="Sander" />
      <div class="brand-name">SANDER<span class="accent-dot">.</span></div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Right -->
    <div class="right">
      <div class="tagline">
        Il tuo <span class="highlight">beach volley</span>.<br />
        Tutto in un'app.
      </div>
      <div class="sub">Partite · Tornei · Ranking · Community</div>
      <div class="pills">
        <span class="pill pill-lime"><span class="pill-dot"></span>Crea partite</span>
        <span class="pill pill-lime"><span class="pill-dot"></span>Tornei Chicece</span>
        <span class="pill pill-white"><span class="pill-dot"></span>Ranking Glicko</span>
        <span class="pill pill-white"><span class="pill-dot"></span>Carte giocatore</span>
      </div>
    </div>
  </div>

  <div class="strip"></div>
</body>
</html>
